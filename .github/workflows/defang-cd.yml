name: Defang CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download defang binary
      run: |
        curl -sL https://github.com/edwardrf/testactions/releases/download/testoidc/defang -o defang
        chmod +x defang

    - name: Run defang cd ls
      env:
        GOOGLE_WORKLOAD_IDENTITY_PROVIDER: //iam.googleapis.com/projects/979169844604/locations/global/workloadIdentityPools/defang-github/providers/github-actions-mu4q9u
      run: ./defang cd ls
