name: Defang CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Checkout defang
      uses: actions/checkout@v4
      with:
        repository: DefangLabs/defang
        ref: edw/interactive-login
        path: defang-src

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: defang-src/src/go.mod
        cache-dependency-path: defang-src/src/go.sum

    - name: Build defang
      run: |
        ls -lah
        pwd
        uname -a
        cat /proc/cpuinfo
        go build -o defang ./cmd/cli
      working-directory: defang-src/src

    - name: Run defang cd ls
      env:
        GOOGLE_WORKLOAD_IDENTITY_PROVIDER: //iam.googleapis.com/projects/979169844604/locations/global/workloadIdentityPools/defang-github/providers/github-actions-mu4q9u
        GCP_PROJECT_ID: edw-test-samples-7
      run: |
        echo -n "eyJhbGciOiJFUzI1NiIsImtpZCI6IjEzYjExNWJmLWU5NmItNGFlNy04ZDY0LWE3NjVkNzMyZGJiNiIsInR5cCI6IkpXVCJ9..BQHLfC5aV3a7oF9cGQGZ3lc6vUme5zzwdI3yEe8h4HHNGe0RpIHKgcNNOLN43wCVmXFjIT4mk7xEnMDLljFaaw" > /home/runner/.local/state/defang/fabric-prod1.defang.dev
        # ./defang-src/src/defang stack ls --debug
        ./defang-src/src/defang cd ls --debug
