name: Defang CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download defang binary
      run: |
        gh release download testoidc --repo edwardrf/testactions --pattern defang
        chmod +x defang
        ls -lah
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Run defang cd ls
      env:
        GOOGLE_WORKLOAD_IDENTITY_PROVIDER: //iam.googleapis.com/projects/979169844604/locations/global/workloadIdentityPools/defang-github/providers/github-actions-mu4q9u
      run: |
        ls -lah
        ./defang cd ls
