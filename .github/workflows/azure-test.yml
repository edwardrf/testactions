name: Azure OIDC validation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: 13ab1561-9cfe-4732-b91c-820dcc814c35
          tenant-id: 12c0f515-fa47-402f-9982-de7646d3cb28
          subscription-id: f311c4db-e998-4c94-906c-7e2637303a05

      - name: Show resolved Azure context
        run: az account show
