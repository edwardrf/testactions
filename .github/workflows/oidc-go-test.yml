name: OIDC Go test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: 1925ec40-78d0-483c-8cb7-e27366b79a88
      AZURE_TENANT_ID: 12c0f515-fa47-402f-9982-de7646d3cb28
      AZURE_SUBSCRIPTION_ID: f311c4db-e998-4c94-906c-7e2637303a05
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run OIDC test
        run: go run ./cmd/oidc-test
