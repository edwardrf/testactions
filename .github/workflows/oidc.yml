name: Get Github ID Token
on:
  push:
    branches:
      - main

jobs:
  job:
    environment: Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Install OIDC Client from Core Package
      run: npm install @actions/core@1.6.0 @actions/http-client
    - name: Get Id Token
      uses: actions/github-script@v8
      id: idtoken
      with:
        script: |
          const coredemo = require('@actions/core')
          let id_token = await coredemo.getIDToken()
          const parts = id_token.split('.');
          if (parts.length !== 3) {
            throw new Error('Invalid JWT format');
          }
          const header = JSON.parse(Buffer.from(parts[0], 'base64').toString('utf8'));
          const payload = JSON.parse(Buffer.from(parts[1], 'base64').toString('utf8'));
          console.log("jwt:");
          console.log(id_token.match(/.{1,60}/g).join('\n'));
          console.log("header:", header);
          console.log("payload:", payload);
          coredemo.setOutput('header', header);
          coredemo.setOutput('payload', payload);
    - name: Get OIDC token
      id: idtoken2
      run: |
        echo "TOKEN=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL")" >> $GITHUB_ENV
    - name: Write token to file
      run: |
        echo "$TOKEN" > token.jwt
        cat token.jwt
