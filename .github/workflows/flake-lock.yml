name: Check flake.lock in sync with cli

on:
  pull_request:
    paths:
      - "flake.lock"
  schedule:
    - cron: '*/5 * * * *'


permissions:
  contents: read

jobs:
  CheckEventName:
    name: Check event name
    runs-on: ubuntu-latest
    steps:
      - run: | 
          echo "The event name is ${{ github.event_name }}"
          echo "Is the event schedule? ${{ github.event_name == 'schedule' }}"
          echo "Is the event pull_request? ${{ github.event_name == 'pull_request' }}"
          echo "Test ternery: ${{ github.event_name == 'schedule' && 'yes' || 'no' }}"
