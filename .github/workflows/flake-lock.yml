name: Check flake.lock in sync with cli

on:
  pull_request:
    paths:
      - "flake.lock"

permissions:
  contents: read

jobs:
  flake-lock:
    name: Check flake.lock in sync with cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            flake.lock
          sparse-checkout-cone-mode: false

      - name: fetch cli flakes.lock
        run: |
          curl -o cli-flake.lock https://raw.githubusercontent.com/DefangLabs/defang/refs/heads/main/flake.lock
          
      - name: diff
        run: |
          if ! diff <(jq --sort-keys <cli-flake.lock) <(jq --sort-keys <flake.lock); then 
            echo "::warning::flake.lock is out of sync with cli flake.lock"
            exit 1
          fi
